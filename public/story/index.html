<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>What if it could exist? — Darwin story</title>
  <style>
    @font-face {
      font-family: Instrument;
      src: url("./assets/instrument-serif.woff2");
    }
    @font-face {
      font-family: Handjet;
      src: url("./assets/handjet-regular.ttf") format("truetype");
      font-weight: 400;
    }
    @font-face {
      font-family: HelveticaNow;
      src: url("./assets/helvetica-now-display.otf");
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #160f19;
      color: #f7eddf;
      font:
        14px HelveticaNow,
        Arial,
        sans-serif;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 26px 32px;
      border-bottom: 1px solid #ffffff12;
    }
    h1 {
      font-size: 18px;
      font-weight: 400;
      margin: 0;
    }
    header p {
      margin: 7px 0 0;
      color: #9f919f;
      font-size: 12px;
    }
    .tag {
      font-size: 10px;
      letter-spacing: 0.18em;
      color: #d3aabd;
    }
    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 252px;
      min-height: calc(100vh - 95px);
    }
    .stage {
      display: grid;
      place-items: center;
      padding: 28px;
      background: radial-gradient(
        ellipse at 50% 45%,
        #39253655,
        transparent 70%
      );
      position: relative;
    }
    canvas {
      height: calc(100vh - 155px);
      max-height: 920px;
      max-width: 100%;
      object-fit: contain;
      box-shadow: 0 24px 80px #0006;
    }
    aside {
      border-left: 1px solid #ffffff12;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 26px;
    }
    label,
    .label {
      display: block;
      color: #b9a6b5;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0 0 12px;
    }
    .formats {
      display: flex;
      gap: 8px;
    }
    select {
      width: 100%;
      padding: 11px 10px;
      border: 1px solid #ffffff28;
      border-radius: 7px;
      background: #281c2c;
      color: #f7eddf;
      font: inherit;
    }
    select:focus-visible {
      outline: 2px solid #e5a0c0;
      outline-offset: 3px;
    }
    #touch-moment {
      margin-top: 12px;
      width: 100%;
      font-size: 12px;
    }
    button {
      font: inherit;
      background: #281c2c;
      border: 1px solid #ffffff1e;
      color: inherit;
      border-radius: 7px;
      padding: 11px 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #432c44;
    }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #e5a0c0;
      outline-offset: 3px;
    }
    button:disabled {
      opacity: 0.4;
      cursor: wait;
    }
    button[aria-pressed="true"] {
      background: #f0dddf;
      color: #26172b;
      border-color: #f0dddf;
    }
    .formats button {
      flex: 1;
      padding: 20px 10px;
      font-size: 17px;
    }
    .meta {
      font-size: 11px;
      color: #9f919f;
      margin: 12px 0 0;
    }
    .transport {
      display: flex;
      gap: 8px;
    }
    .transport button {
      flex: 1;
    }
    .exports {
      display: grid;
      gap: 8px;
      margin-top: auto;
    }
    .primary {
      background: #dfb0c8;
      color: #241629;
    }
    .primary:hover {
      background: #f0c8dd;
    }
    input {
      width: 100%;
      accent-color: #dfa8c5;
    }
    #status {
      font-size: 12px;
      color: #b9a6b5;
      line-height: 1.6;
      min-height: 38px;
    }
    .credit {
      font:
        11px Instrument,
        serif;
      font-size: 20px;
      color: #b69dac;
      margin: 0;
    }
    .loading {
      position: absolute;
      color: #e0cbdc;
      pointer-events: none;
    }
    .hidden {
      display: none;
    }
    @media (max-width: 650px) {
      header {
        padding: 20px;
      }
      .workspace {
        grid-template-columns: 1fr;
      }
      .stage {
        padding: 20px;
      }
      canvas {
        height: 65vh;
        max-width: 100%;
      }
      aside {
        border-left: 0;
        border-top: 1px solid #ffffff12;
        padding: 24px;
        gap: 20px;
      }
      .formats button {
        padding: 12px;
      }
      .exports {
        margin: 0;
      }
      header .tag {
        display: none;
      }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
  <header>
    <div>
      <h1>Story Studio</h1>
      <p>An idea, somewhere between imagined and real.</p>
    </div>
    <span class="tag">DARWIN / MOTION STUDIES</span>
  </header>
  <main class="workspace">
    <div class="stage">
      <canvas
        id="story"
        aria-label="What if it could Exist? A thought, rendered."
      ></canvas
      ><span id="loading" class="loading">Rendering a thought…</span>
    </div>
    <aside>
      <section>
        <label for="scene">Animation</label>
        <select id="scene">
          <option value="surreal">01 — A thought, rendered</option>
          <option value="creation">02 — The first touch</option>
        </select>
      </section>
      <section>
        <p class="label">Canvas</p>
        <div class="formats">
          <button id="portrait" aria-pressed="true">9:16</button
          ><button id="feed" aria-pressed="false">3:4</button>
        </div>
        <p class="meta" id="dimensions">1080 × 1920 · Story</p>
      </section>
      <section>
        <p class="label">Playback · 10 second loop</p>
        <div class="transport">
          <button id="pause">Pause</button><button id="replay">Replay</button>
        </div>
        <label for="timeline" style="margin-top: 20px"
          >Timeline <span id="time">0.0s</span></label
        ><input
          id="timeline"
          type="range"
          min="0"
          max="9.99"
          step="0.01"
          value="0"
        />
        <button id="touch-moment" class="hidden">
          View the fingertip contact
        </button>
      </section>
      <section>
        <p class="credit" id="scene-title">A thought, rendered.</p>
        <p class="meta" id="scene-description">
          Instrument Serif / Handjet<br />Helvetica Now Display
        </p>
      </section>
      <section class="exports">
        <p class="label">Take it with you</p>
        <button id="export-video" class="primary">Export video</button
        ><button id="export-still">Save current frame</button>
        <p id="status" role="status" aria-live="polite">
          Loading the scene and typefaces…
        </p>
      </section>
    </aside>
  </main>
  <script type="module">
    import("./story.js").catch((error) => {
      document.querySelector("#loading").textContent =
        "The scene could not load.";
      document.querySelector("#status").textContent =
        "Please reload in a browser with WebGL enabled.";
      document
        .querySelectorAll("button,input,select")
        .forEach((el) => (el.disabled = true));
      console.error(error);
    });
  </script>
</html>
